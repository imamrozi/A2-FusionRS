# configs/tripadvisor_hotel_config_absa_concat_confidence_tuned.yaml
# Kandidat dari stage0_optimizer_lr (scripts/tune_deepmf_oof_val.py,
# checkpoint tuning_deepmf_oof_val_search_v2.csv): optimizer=adam,
# learning_rate=0,002 -- val_fusion_RMSE 0,9803, kurva lr jauh lebih mulus
# dari SGD (tidak ada kolaps tajam spt lr=0,005 SGD).
#
# SUDAH DIVERIFIKASI ke test set (Temuan 16, memori sesi, --results-tag
# tuned_adam): test RMSE 1,1309 vs default (SGD lr=0,001) 1,1183 --
# NEAR-MISS (+1,1%, jauh lebih kecil dari selisih SGD lr=0,003 +16,8%
# atau lr=0,005 +38,6%), BELUM mengalahkan default. Log training tunjukkan
# overfitting jelas (train MSE turun ke 0,002, val RMSE berosilasi tdk
# monoton) -- epochs=20 (diwarisi era tuning SGD) diduga kelewat banyak
# utk Adam yg konvergen jauh lbh cepat. Investigasi lanjut: stage_adamw_
# epochs & stage_adamw_weight_decay (fitur khas AdamW, weight_decay=0
# membuatnya == Adam polos scr matematis, blm pernah diuji >0). File ini
# BELUM final -- akan diupdate kalau ada kombinasi yg benar2 mengalahkan
# default di test.
#
# CATATAN: SGD lr=0,003 (val_fusion_RMSE 0,9317, tampak "lebih baik" dari
# Adam di val) SENGAJA TIDAK dipakai lagi -- itu persis config yg SUDAH
# terbukti GAGAL di test (Temuan 13 memori sesi: test RMSE 1,3065, lebih
# buruk dari default 1,1183).
#
# CBF pca_components=90 (scripts/tune_deepmf_cbf_pilot.py --skip-deepmf,
# val RMSE 0,9686 vs default 50 -> 1,0199) -- dipakai konsisten dgn saat
# stage0_optimizer_lr dijalankan.

_base: tripadvisor_hotel_config_absa_concat_confidence.yaml

deepmf:
  optimizer: adam
  learning_rate: 0.002

cbf_clustering:
  pca_components: 90
