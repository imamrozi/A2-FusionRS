# configs/tripadvisor_hotel_config_absa_concat_confidence_tuned.yaml
# Verifikasi Step 1 pilot tuning (scripts/tune_deepmf_cbf_pilot.py): DeepMF
# learning_rate 0.001->0.005 (val RMSE 1,1236->0,9312, -17,1%) dan CBF
# pca_components 50->70 (val RMSE 1,0199->1,0077, -1,2%) pada domain hotel.
# Config ini pakai hyperparameter hasil pilot tsb, sisanya identik dgn
# tripadvisor_hotel_config_absa_concat_confidence.yaml -- utk mengukur
# dampak NYATA di test set stlh lewat fusion penuh (bukan cuma val RMSE
# per-stream), dibandingkan hasil sebelum tuning (RMSE 0,6345/0,9565/1,1183
# utk target_review/P3/no_sentiment).

_base: tripadvisor_hotel_config_absa_concat_confidence.yaml

deepmf:
  learning_rate: 0.005

cbf_clustering:
  pca_components: 70
